name: Calendar Guard regression tests

on:
  pull_request:
    paths:
      - "guard.py"
      - "schedule_preview.py"
      - "preview_compat.py"
      - "test_*.py"
      - ".github/workflows/guard-tests.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -p 'test*.py' -v
